<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Toubacko Package-Formular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: petrol header with the step rail on the left (top strip on phones), one working card per step on a cool grey ground. */
:root{
  --ground:#F2F5F6; --card:#FFFFFF; --ink:#1E2A30; --muted:#5D6B72; --line:#DCE3E6;
  --petrol:#0F3D4C; --petrol-ink:#EAF2F4; --blue:#2295D7; --blue-ink:#FFFFFF; --soft:#E8F3FA;
  --ok:#1E8A5A; --warn:#B4610E; --err:#C0392B; --focus:#2295D7;
  --body:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1A1F; --card:#15252C; --ink:#E7EEF0; --muted:#9DB0B7; --line:#26404A;
  --petrol:#0A2B36; --petrol-ink:#E7EEF0; --blue:#4AAEE8; --blue-ink:#06202B; --soft:#173748;
  --ok:#47C08A; --warn:#E59A4C; --err:#EE7B6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1A1F; --card:#15252C; --ink:#E7EEF0; --muted:#9DB0B7; --line:#26404A;
  --petrol:#0A2B36; --petrol-ink:#E7EEF0; --blue:#4AAEE8; --blue-ink:#06202B; --soft:#173748;
  --ok:#47C08A; --warn:#E59A4C; --err:#EE7B6E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--petrol)}
header.top{background:var(--petrol);color:var(--petrol-ink);position:sticky;top:env(safe-area-inset-top, 0px);z-index:9}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.wordmark{font-weight:700;font-size:1.45rem;letter-spacing:-.02em;color:#fff}
.wordmark span{color:#6FC0EE}
.brand small{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:4px}
.top .spacer{flex:1}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--petrol-ink);font:600 .76rem var(--body);padding:6px 10px;cursor:pointer;letter-spacing:.05em;opacity:.8}
.lang button[aria-pressed="true"]{background:var(--petrol-ink);color:var(--petrol);opacity:1}
.saved{font-size:.78rem;opacity:.75}

.proto{background:var(--soft);border-bottom:1px solid var(--line);font-size:.84rem}
.proto .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px}
.proto b{color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:4px 12px;font:500 .8rem var(--body);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink)}

.layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding-block:28px 64px;align-items:start}
nav.steps{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
nav.steps button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font:500 .9rem var(--body);color:var(--muted);cursor:pointer;width:100%}
nav.steps button .n{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
nav.steps button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
nav.steps button[aria-current="step"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
nav.steps button[aria-current="step"] .n{border-color:var(--blue);color:var(--blue)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:16px;padding-block:16px 48px}
  nav.steps{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.steps button{width:auto;flex:0 0 auto}
  nav.steps button .t{display:none}
  nav.steps button[aria-current="step"] .t{display:inline}
}

main{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px}
@media (max-width:560px){.panel{padding:18px}}
.panel-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.panel h2{font-size:1.45rem}
.lede{color:var(--muted);max-width:68ch}

.note{display:flex;gap:10px;background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.note::before{content:"i";flex:0 0 20px;height:20px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;font-size:.75rem;font-style:italic;margin-top:1px}
.note.warn::before{content:"!";background:var(--warn);font-style:normal}

fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;min-width:0}
legend{font-weight:700;font-size:1rem;padding:0;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
@media (max-width:640px){.grid,.grid.three{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.85rem;font-weight:600}
.hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
  font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.prefilled input,.prefilled select{background:var(--ground)}
.count{font-size:.75rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--err);font-weight:600}
.req::after{content:" *";color:var(--err)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 13px;font:500 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}

.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--blue);flex:0 0 18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .92rem var(--body);border-radius:999px;padding:10px 20px;border:1.5px solid transparent;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--blue);color:var(--blue-ink)}
.btn-ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn-small{padding:6px 14px;font-size:.84rem}
.btn-link{background:none;border:0;color:var(--err);font:500 .84rem var(--body);cursor:pointer;padding:4px}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

.item{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-head h3{font-size:1rem}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--blue)}

.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:.9rem;cursor:pointer;background:var(--ground)}
.drop.over{border-color:var(--blue);color:var(--blue)}
.drop input{display:none}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pic{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.pic img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--ground)}
.pic .body{padding:10px;display:flex;flex-direction:column;gap:8px}
.pic .meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--muted)}
.pic .meta .low{color:var(--warn);font-weight:600}
.pic.main{outline:3px solid var(--blue)}
.star{background:none;border:1px solid var(--line);border-radius:999px;font:500 .75rem var(--body);padding:3px 9px;cursor:pointer;color:var(--ink)}
.star[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

.days{display:flex;flex-direction:column;gap:14px}
.day h3{font-size:.95rem;margin-bottom:8px}
.row{display:grid;grid-template-columns:140px minmax(0,1fr) 140px 100px 34px;gap:8px;align-items:start}
@media (max-width:640px){.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}}
.row + .row{margin-top:8px}

.perkgroup{display:flex;flex-direction:column;gap:6px}
.perkgroup h3{font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.perk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.perk .extra{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.perk{grid-template-columns:1fr}.perk .extra{grid-template-columns:1fr}}
.levels{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.levels button{border:0;background:var(--card);padding:5px 11px;font:500 .8rem var(--body);color:var(--muted);cursor:pointer}
.levels button[aria-pressed="true"].l-basic{background:var(--muted);color:#fff}
.levels button[aria-pressed="true"].l-premium{background:var(--blue);color:var(--blue-ink)}
.levels button[aria-pressed="true"].l-smart{background:var(--ok);color:#fff}
.levels button[aria-pressed="true"].l-none{background:var(--line);color:var(--ink)}

.sum{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sum td,.sum th{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.sum td:last-child,.sum th:last-child{text-align:right;white-space:nowrap}
.sum tr.total td{font-weight:700;background:var(--soft)}
.table-x{overflow-x:auto}

.hol{display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hol .d{font-size:.8rem;color:var(--muted)}
.crit{padding:10px 0;border-bottom:1px solid var(--line)}.crit .hol{border-bottom:0;padding:6px 0 0;grid-template-columns:auto 90px auto;justify-content:start}
@media (max-width:640px){.hol{grid-template-columns:1fr 90px}.hol .levels{grid-column:1/-1}}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tiers{grid-template-columns:1fr}}
.tier{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:10px}
.tier input{width:70px}

.review{display:flex;flex-direction:column;gap:12px}
.review .blk{border:1px solid var(--line);border-radius:10px;padding:14px}
.review .blk h3{font-size:.9rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.review dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:4px 12px;margin:0;font-size:.88rem}
.review dt{color:var(--muted)}
.review dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.review dl{grid-template-columns:1fr}}
.missing{color:var(--err);font-weight:600}
pre.json{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.75rem;max-height:320px;overflow:auto;white-space:pre}
.done-msg{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done-msg .tick{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:700}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="wordmark">Tou<span>backo</span></span><small>Tourism Back Office</small></div>
    <div class="spacer"></div>
    <span class="saved" id="saved"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
  </div>
</header>
<div class="proto"><div class="wrap">
  <span><b>Prototyp</b> – speichert und sendet nichts. Vorausgefüllt mit einem erfundenen Beispielpartner.</span>
  <span class="seg" role="group" aria-label="Partnertyp"><button type="button" id="pt-hotel">Hotel</button><button type="button" id="pt-hero">Local Hero</button></span>
</div></div>

<div class="wrap layout">
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <main id="main"></main>
</div>

 i_where:["Your photos sell your package. They appear as a gallery on your package page, and travel agencies, tour operators and influencers who resell your package show the same photos. With a title and a short text you tell the guest what they see: “Breakfast on the veranda” says more than the photo alone.","Suas fotos vendem o seu pacote. Elas aparecem como galeria na página do pacote, e agências, operadoras e influenciadores que revendem o seu pacote mostram as mesmas fotos. Com título e um texto curto você diz ao hóspede o que ele vê: “Café da manhã na varanda” diz mais do que a foto sozinha.","Ihre Bilder verkaufen Ihr Package. Sie erscheinen als Galerie auf Ihrer Package-Seite, und Reisebüros, Reiseveranstalter und Influencer, die Ihr Package weiterverkaufen, zeigen dieselben Bilder. Mit Titel und kurzem Text sagen Sie dem Gast, was er sieht: „Frühstück auf der Veranda“ sagt mehr als das Bild allein.","Vos photos vendent votre forfait. Elles apparaissent en galerie sur la page du forfait, et les agences, tour-opérateurs et influenceurs qui le revendent montrent les mêmes photos. Avec un titre et un court texte, vous dites au voyageur ce qu'il voit : « Petit-déjeuner sur la véranda » en dit plus que la photo seule."],
 acc_title:["Accommodation / overnight stay","Hospedagem / pernoite","Unterkunft / Übernachtung","Hébergement / nuitée"],

 p_short_hint:["Make guests look forward to the trip: what will they experience that they cannot book anywhere else? Show that this is not an ordinary room but a curated experience with your insider contacts.","Desperte a vontade de viajar: o que o hóspede vai viver que não encontra em nenhum outro lugar? Mostre que não é um quarto comum, mas uma experiência com curadoria e seus contatos locais.","Machen Sie Lust auf die Reise: Was erlebt der Gast, das er sonst nirgends buchen kann? Zeigen Sie, dass es kein gewöhnliches Zimmer ist, sondern ein kuratiertes Erlebnis mit Ihren Insider-Kontakten.","Donnez envie de partir : que vivra le voyageur qu'il ne peut réserver nulle part ailleurs ? Montrez qu'il ne s'agit pas d'une simple chambre mais d'une expérience organisée avec vos contacts sur place."],

 pr_st:["In the package","No pacote","Im Package","Dans le forfait"],
 pr_included:["Included","Incluído","Inbegriffen","Inclus"],pr_optional:["Optional","Opcional","Optional","En option"],pr_suggested:["Suggestion","Sugestão","Vorschlag","Suggestion"],

 copyright:["Only upload photos you own or may use. By uploading, you confirm that you may use them and allow Toubacko and its sales partners to publish them with your package. Please name the photographer in the photo text if credit is required.","Envie apenas fotos que sejam suas ou que você tenha direito de usar. Ao enviar, você confirma que pode usá-las e autoriza a Toubacko e seus parceiros de venda a publicá-las com o seu pacote. Se for preciso dar crédito, cite o fotógrafo no texto da foto.","Laden Sie nur Bilder hoch, die Ihnen gehören oder die Sie verwenden dürfen. Mit dem Hochladen bestätigen Sie, dass Sie sie verwenden dürfen, und erlauben Toubacko und seinen Vertriebspartnern, sie mit Ihrem Package zu veröffentlichen. Falls ein Bildnachweis nötig ist, nennen Sie den Fotografen im Bildtext.","N'envoyez que des photos qui vous appartiennent ou que vous pouvez utiliser. En les envoyant, vous confirmez pouvoir les utiliser et autorisez Toubacko et ses partenaires de vente à les publier avec votre forfait. Si un crédit est requis, indiquez le photographe dans le texte de la photo."],

 p_main_hint:["One photo that appears everywhere: as the tile on the Toubacko globe, in the offer overview and with resellers. If you leave it empty, we use the first photo of your hotel.","Uma foto que aparece em todo lugar: no card do globo Toubacko, na visão geral das ofertas e nos revendedores. Se ficar vazio, usamos a primeira foto do seu hotel.","Ein Bild, das überall erscheint: als Kachel auf dem Toubacko-Globus, in der Angebotsübersicht und bei Wiederverkäufern. Bleibt das Feld leer, nehmen wir das erste Bild Ihres Hotels.","Une photo qui apparaît partout : vignette sur le globe Toubacko, aperçu des offres et chez les revendeurs. Si vous la laissez vide, nous prenons la première photo de votre hôtel."],
 s_lede:["Describe everything your guest will experience. For each experience you decide whether it is a service you offer, a suggestion or an option. Approximate prices are fine; always calculate for 2 travellers.","Descreva tudo o que o hóspede vai viver. Para cada experiência você decide se é um serviço que você oferece, uma sugestão ou um opcional. Preços aproximados estão ok; calcule sempre para 2 viajantes.","Beschreiben Sie hier alles, was Ihr Gast erleben wird. Bei jedem Erlebnis entscheiden Sie, ob es eine Leistung ist, die Sie anbieten, ein Vorschlag oder eine Option. Ungefähre Preise genügen; rechnen Sie immer für 2 Reisende.","Décrivez tout ce que vivra votre voyageur. Pour chaque expérience, vous décidez s'il s'agit d'une prestation que vous offrez, d'une suggestion ou d'une option. Des prix approximatifs suffisent ; calculez toujours pour 2 voyageurs."],

/* ---------- small builders ---------- */
function inp(path,label,{type='text',req=false,hint='',ph='',full=false,max=0,rows=0}={}){
  const id='f-'+path.replace(/\./g,'-'); const v=getP(path)??'';
  const ctl = rows ? `<textarea id="${id}" data-k="${path}" rows="${rows}" ${max?`data-max="${max}"`:''} placeholder="${esc(ph)}">${esc(v)}</textarea>`
                   : `<input id="${id}" type="${type}" data-k="${path}" value="${esc(v)}" placeholder="${esc(ph)}" ${type==='number'?'inputmode="decimal" min="0" step="any"':''}>`;
  return `<div class="field ${full?'full':''}"><label for="${id}" class="${req?'req':''}">${esc(label)}</label>${ctl}${max?`<div class="count" data-count="${id}">${String(v).length} / ${max}</div>`:''}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
}
function sel(path,label,group,{req=false,full=false}={}){
  const id='f-'+path.replace(/\./g,'-'); const v=getP(path);
  return `<div class="field ${full?'full':''}"><label for="${id}" class="${req?'req':''}">${esc(label)}</label><select id="${id}" data-k="${path}">${Object.keys(OPT[group]).map(k=>`<option value="${k}" ${k===v?'selected':''}>${esc(o(group,k))}</option>`).join('')}</select></div>`;
}
function chk(path,label,id){ return `<label class="check" for="${id}"><input type="checkbox" id="${id}" data-k="${path}" ${getP(path)?'checked':''}><span>${esc(label)}</span></label>`; }
function note(k,warn){ return `<div class="note ${warn?'warn':''}"><span>${esc(t(k))}</span></div>`; }
function head(i,k,lede){ return `<div class="panel-head"><span class="eyebrow">${esc(t('step'))} ${i+1} ${esc(t('of'))} ${STEPS.length}</span><h2>${esc(t('st_'+k))}</h2>${lede?`<p class="lede">${esc(t(lede))}</p>`:''}</div>`; }
function picsBlock(listPath,max,dropId,{withMain=false}={}){
  const list=getP(listPath)||[];
  return `<label class="drop" id="${dropId}" for="${dropId}-in" data-list="${listPath}" data-max="${max}"><input type="file" id="${dropId}-in" accept="image/jpeg,image/webp,image/png" ${max>1?'multiple':''} data-list="${listPath}" data-max="${max}">${esc(t('i_drop'))}</label>
  <div class="pics">${list.map((p,i)=>`<div class="pic ${withMain&&p.main?'main':''}"><img src="${p.src}" alt="${esc(p.title||p.name)}">
    <div class="body">${max>1?`<input type="text" id="pt-${dropId}-${i}" aria-label="${esc(t('i_title'))}" placeholder="${esc(t('i_title'))}" data-k="${listPath}.${i}.title" value="${esc(p.title)}">
    <textarea rows="2" id="px-${dropId}-${i}" aria-label="${esc(t('i_text'))}" placeholder="${esc(t('i_text'))}" data-k="${listPath}.${i}.text">${esc(p.text)}</textarea>`:''}
    <div class="meta"><span class="${p.w&&p.w<1080?'low':''}">${p.w?`${p.w}×${p.h}px`:''}${p.w&&p.w<1080?' · '+esc(t('i_low')):''}</span>
    <span>${withMain?`<button type="button" class="star" data-main="${listPath}" data-i="${i}" aria-pressed="${!!p.main}">${esc(t('i_main'))}</button>`:''}
    <button type="button" class="btn-link" data-rmpic="${listPath}" data-i="${i}">${esc(t('i_remove'))}</button></span></div></div></div>`).join('')}</div>`;
}

function calc(){ const acc=+S.acc.price||0;
 const inc=S.services.filter(s=>s.status==='included');
 const pp=inc.filter(s=>s.type!=='transfer').reduce((a,s)=>a+(+s.price||0),0);
 const veh=inc.filter(s=>s.type==='transfer').reduce((a,s)=>a+(+s.price||0),0);
 return {acc,pp,veh,two:acc+2*pp+veh,one:acc+pp+veh}; }
const money = v => new Intl.NumberFormat(S.lang==='pt'?'pt-BR':S.lang==='de'?'de-CH':S.lang==='fr'?'fr-FR':'en-GB',{style:'currency',currency:S.currency,maximumFractionDigits:0}).format(v||0);

function missing(){ const m={};
 const add=(s,k)=>{ (m[s]=m[s]||[]).push(k); };
 if(!S.master.fantasy) add('master','f_fantasy'); if(!S.master.email) add('master','f_email'); if(!S.masterOk) add('master','m_confirm');
 if(isHero()){ if(!S.about.first) add('about','lh_first'); if(!S.about.prof) add('about','lh_prof'); if(!S.about.intro) add('about','lh_intro'); if(!S.about.partnerHotel) add('about','lh_hotel'); }
 else { if(!S.about.rooms) add('about','h_rooms'); if(!S.about.desc) add('about','h_desc'); if(!S.about.contact.email) add('about','c_title'); }
 if(!S.pkg.title) add('package','p_title'); if(!S.pkg.short) add('package','p_short'); if(!S.pkg.interests.length) add('package','p_interests');
 if(!S.acc.title) add('acc','acc_name'); if(!S.acc.price) add('acc','s_price_room'); if(!S.images.length) add('acc','acc_photos'); if(S.images.length&&!S.copyright) add('acc','copyright_ok');
 return m; }

 keep.forEach(k=>b[k]=S[k]); ['logo','portrait','images'].forEach(k=>(b[k]||[]).forEach(q=>delete q.fileId));
 b.services=S.services.map(sv=>({...sv,prev:true,photos:(sv.photos||[]).map(q=>{const c={...q}; delete c.fileId; return c;})})); b.count=(S.count||1)+1; S=b; go(STEPS.indexOf('package')); }
function sentView(){ if(LIVE) return `<div class="done-msg"><div class="tick">✓</div><h2>${esc(t('r_done'))}</h2><p class="lede">${esc(t('r_done_p'))}</p></div>${moreBlock()}`;
 const c=JSON.parse(JSON.stringify(S)); const strip=a=>(a||[]).map(p=>({file:p.name,title:p.title,text:p.text,width:p.w,height:p.h,main:!!p.main}));
 c.images=strip(S.images); c.portrait=strip(S.portrait); c.logo=strip(S.logo); c.mainImg=strip(S.mainImg); c.services=S.services.map(s=>({...s,photos:strip(s.photos)})); c.price=calc(); delete c.step; delete c.sent;
 return `<div class="done-msg"><div class="tick">✓</div><h2>${esc(t('r_done'))}</h2><p class="lede">${esc(t('r_done_p'))}</p></div>
 ${moreBlock()}
 ${note('r_proto',true)}<pre class="json">${esc(JSON.stringify(c,null,2))}</pre>
 <div><button type="button" class="btn btn-ghost" id="unsend">${esc(t('back'))}</button></div>`; }

/* ---------- render ---------- */
const main=document.getElementById('main'), nav=document.getElementById('steps');
function render(){
  document.documentElement.lang = S.lang==='pt'?'pt-BR':S.lang;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===S.lang));
  if (BOOT !== 'ready') { nav.innerHTML=''; main.innerHTML = `<section class="panel"><p class="${BOOT==='loading'?'lede':'missing'}">${esc(t(BOOT==='loading'?'live_loading':BOOT==='error'?'live_error':'live_badlink'))}</p></section>`; return; }
  document.getElementById('pt-hotel').setAttribute('aria-pressed', !isHero()); document.getElementById('pt-hero').setAttribute('aria-pressed', isHero());
  const m=missing();
  nav.innerHTML = STEPS.map((k,i)=>`<button type="button" data-go="${i}" ${i===S.step?'aria-current="step"':''} class="${i<S.step&&!m[k]?'done':''}"><span class="n">${i<S.step&&!m[k]?'✓':i+1}</span><span class="t">${esc(t('st_'+k))}</span></button>`).join('');
  const last = S.step===STEPS.length-1;
  main.innerHTML = `<section class="panel">${R[STEPS[S.step]](S.step)}
   ${S.sent?'':`<div class="actions"><button type="button" class="btn btn-ghost" id="prev" ${S.step===0?'hidden':''}>← ${esc(t('back'))}</button><span></span>
   <button type="button" class="btn btn-primary" id="${last?'send':'next'}">${last?esc(t('r_send')):esc(t('next'))+' →'}</button></div>`}</section>`;
}
function go(n){ S.step=Math.max(0,Math.min(STEPS.length-1,n)); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- events ---------- */
main.addEventListener('input', e=>{ const el=e.target, k=el.dataset.k; if(!k) return;
  let v = el.type==='checkbox' ? el.checked : el.value; if(el.dataset.num) v=+v; setP(k,v);
  const pm=k.match(/^program\.(\d+)\.(\d+)\.svc$/); if(pm&&v&&v!=='acc'){ const sv=S.services.find(x=>x.id===v); if(sv) S.program[pm[1]][+pm[2]].st=sv.status; }
  if(el.dataset.max){ const c=main.querySelector(`[data-count="${el.id}"]`); if(c){ c.textContent=`${el.value.length} / ${el.dataset.max}`; c.classList.toggle('over', el.value.length>+el.dataset.max); } }
  if(el.dataset.rerender || k==='avail.nonref' || el.tagName==='SELECT' && /\.type$|^currency$|cc\.role$/.test(k)) render();
  if(el.type==='number' && STEPS[S.step]==='price') render();
  save(); });
main.addEventListener('change', e=>{ const el=e.target;
  if(el.type==='file'){ addFiles(el.files, el.dataset.list, +el.dataset.max); el.value=''; } });
main.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(b.id==='next') return go(S.step+1);
  if(b.id==='prev') return go(S.step-1);
  if(b.id==='send'){ const ok=!Object.keys(missing()).length && S.agreeTexts && S.agreeTrue; if(!ok){ document.getElementById('send-err').hidden=false; return; } if(LIVE){ sendLive(b); return; } S.sent=true; save(); render(); return; }
  if(b.id==='unsend'){ S.sent=false; render(); return; }
  if(b.id==='again') return newPackage();
  if(b.id==='finish'){ S.closed=true; save(); render(); return; }
  if(d.go!=null) return go(+d.go);
  if(d.int){ const a=S.pkg.interests; const v=+d.int; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); }
  else if(b.id==='add-svc'){ S.services.push({id:uid(),type:'activity',title:'',desc:'',incl:'',price:'',status:'included',days:[...DAYS],times:[],photos:[]}); }
  else if(d.rmsvc!=null){ const id=S.services[+d.rmsvc].id; S.services.splice(+d.rmsvc,1); Object.values(S.program).forEach(rows=>rows.forEach(r=>{ if(r.svc===id) r.svc=''; })); }
  else if(d.svctime!=null){ const sv=S.services[+d.svctime]; sv.times=sv.times||[]; const i=sv.times.indexOf(d.d); i<0?sv.times.push(d.d):sv.times.splice(i,1); }
  else if(d.svcday!=null){ const a=S.services[+d.svcday].days; const i=a.indexOf(d.d); i<0?a.push(d.d):a.splice(i,1); }
  else if(d.addrow){ (S.program[d.addrow]=S.program[d.addrow]||[]).push({slot:'morning',svc:'',free:'',time:'',st:'included'}); }
  else if(d.rmrow){ S.program[d.rmrow].splice(+d.i,1); }
  else if(d.perk){ S.perks[d.perk]=Object.assign(S.perks[d.perk]||{}, {lvl:d.l}); }
  else if(d.crit!=null){ S.avail.crit[+d.crit].m=d.m; }
  else if(d.rmcrit!=null){ S.avail.crit.splice(+d.rmcrit,1); }
  else if(b.id==='add-crit'){ S.avail.crit.push({n:'',from:'',to:'',m:'surch',pct:''}); }
  else if(b.id==='add-black'){ S.avail.black.push({from:'',to:''}); }
  else if(d.rmblack!=null){ S.avail.black.splice(+d.rmblack,1); }
  else if(d.rmpic){ getP(d.rmpic).splice(+d.i,1); }
  else if(d.main){ getP(d.main).forEach((p,i)=>p.main=(i===+d.i)); }
  else return;
  save(); render(); });
['dragover','dragleave','drop'].forEach(ev=>main.addEventListener(ev, e=>{ const z=e.target.closest('.drop'); if(!z) return; e.preventDefault();
  z.classList.toggle('over', ev==='dragover'); if(ev==='drop') addFiles(e.dataTransfer.files, z.dataset.list, +z.dataset.max); }));
function addFiles(files,listPath,max){ let list=getP(listPath); if(!Array.isArray(list)){ list=[]; setP(listPath,list); }
  const arr=[...files].filter(f=>/^image\//.test(f.type));
  for(const f of arr){ if(list.length>=max){ if(max>1) alert0(t('i_max')); break; } if(f.size>10*1024*1024){ alert0(t('i_big')+' ('+f.name+')'); continue; }
    const entry={name:f.name,title:'',text:'',src:'',w:0,h:0,main:false}; if(max===1) list.length=0; list.push(entry);
    const r=new FileReader(); r.onload=()=>{ entry.src=r.result; const im=new Image(); im.onload=()=>{ entry.w=im.naturalWidth; entry.h=im.naturalHeight; render(); }; im.src=r.result; }; r.readAsDataURL(f); }
}
function alert0(msg){ const n=document.createElement('div'); n.className='note warn'; n.innerHTML=`<span>${esc(msg)}</span>`; main.querySelector('.panel')?.prepend(n); setTimeout(()=>n.remove(),5000); }
nav.addEventListener('click', e=>{ const b=e.target.closest('button[data-go]'); if(b) go(+b.dataset.go); });
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{ S.lang=b.dataset.lang; save(); render(); }));
function switchKind(k){ if((k==='hero')===isHero()) return; const keep={lang:S.lang,step:S.step}; S=blankState(k); Object.assign(S,keep); kind=k; save(); render(); }
document.getElementById('pt-hotel').addEventListener('click',()=>switchKind('hotel'));
document.getElementById('pt-hero').addEventListener('click',()=>switchKind('hero'));

/* ---------- live mode: load master data, upload photos, submit ---------- */
function post(obj){ return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)}).then(r=>r.json()); }
function shrink(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const m=2000, k=Math.min(1, m/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.85).split(',')[1]); }; im.onerror=rej; im.src=src; }); }
async function sendLive(btn){
  const err=document.getElementById('send-err'); err.hidden=true; btn.disabled=true;
  const sub=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')+'-'+uid();
  const groups=[['logo',S.logo],['portrait',S.portrait],['main',S.mainImg],['hotel',S.images]].concat(S.services.map((sv,i)=>['exp'+(i+1),sv.photos||[]]));
  const all=[]; groups.forEach(([g,l])=>(l||[]).forEach((pic,i)=>all.push({g,pic,i})));
  try{
    let n=0;
    for(const x of all){ n++; btn.textContent=t('live_sending').replace('{n}',n).replace('{m}',all.length);
      if(x.pic.fileId) continue;
      const r=await post({action:'upload',code:CODE,sub,group:x.g,name:x.g+'-'+(x.i+1)+'.jpg',title:x.pic.title||'',text:x.pic.text||'',mime:'image/jpeg',data:await shrink(x.pic.src)});
      if(!r.ok) throw new Error(r.error); x.pic.fileId=r.fileId; }
    btn.textContent=t('live_finishing');
    const strip=a=>(a||[]).map(q=>({file:q.name,fileId:q.fileId,title:q.title,text:q.text,width:q.w,height:q.h}));
    const c=JSON.parse(JSON.stringify(S)); c.images=strip(S.images); c.portrait=strip(S.portrait); c.logo=strip(S.logo); c.mainImg=strip(S.mainImg);
    c.services=S.services.map(sv=>({...sv,photos:strip(sv.photos)})); c.price=calc(); c.interestNames=S.pkg.interests.map(id=>{const r=INTERESTS.find(x=>x[0]===id); return r?r[1]:id;});
    delete c.step; delete c.sent;
    const r=await post({action:'submit',code:CODE,sub,payload:c}); if(!r.ok) throw new Error(r.error);
    S.sent=true; save(); render(); window.scrollTo({top:0});
  }catch(e){ err.textContent=t('live_error'); err.hidden=false; btn.disabled=false; btn.textContent=t('r_send'); }
}
if (LIVE) {
  document.querySelector('.proto').hidden = true;
  if (CODE) fetch(API_URL+'?p='+encodeURIComponent(CODE)).then(r=>r.json()).then(j=>{
    if(!j.ok){ BOOT='badlink'; return render(); }
    if(!hadDraft){ const lang=S.lang; S=blankState(j.partner.type); S.lang=lang; S.master=Object.assign({},j.partner); S.acc.title=j.partner.fantasy; }
    BOOT='ready'; render();
  }).catch(()=>{ BOOT='error'; render(); });
}
render();
</script>
